<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Carrossel</title>
    <!-- Font Awesome (obrigatório para exibir as setas do MDBootstrap) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <!-- CSS do MDBootstrap -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.css" rel="stylesheet">
    <style>
        /* Mantém todas as imagens na mesma altura e garante destaque para as setas */
        .carousel-item img {
            height: 500px;
            object-fit: cover;
            filter: brightness(0.85);
        }
    </style>
</head>

<body>
    <main class="container my-5">
        <!-- Seção do Carrossel -->
        <section id="carouselMaterialStyle" class="carousel slide carousel-fade" data-mdb-ride="carousel" data-mdb-carousel-init aria-label="Galeria de paisagens">

            <!-- Indicadores -->
            <nav class="carousel-indicators" aria-label="Navegação dos slides">
                <button type="button" data-mdb-target="#carouselMaterialStyle" data-mdb-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-mdb-target="#carouselMaterialStyle" data-mdb-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-mdb-target="#carouselMaterialStyle" data-mdb-slide-to="2" aria-label="Slide 3"></button>
            </nav>

            <!-- Conteúdo dos Slides -->
            <div class="carousel-inner rounded-5 shadow-4-strong">
                <!-- Slide 1 -->
                <figure class="carousel-item active mb-0">
                    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt="Vale com montanhas e rio ao entardecer">
                    <figcaption class="carousel-caption d-none d-md-block">
                        <h5>Montanhas e Vale</h5>
                        <p>Paisagem natural ao entardecer com rio refletindo o céu.</p>
                    </figcaption>
                </figure>

                <!-- Slide 2 -->
                <figure class="carousel-item mb-0">
                    <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt="Raios de sol iluminando uma floresta montanhosa">
                    <figcaption class="carousel-caption d-none d-md-block">
                        <h5>Amanhecer na Serra</h5>
                        <p>Raios de sol atravessando as nuvens sobre a floresta.</p>
                    </figcaption>
                </figure>

                <!-- Slide 3 -->
                <figure class="carousel-item mb-0">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt="Praia tropical com águas cristalinas">
                    <figcaption class="carousel-caption d-none d-md-block">
                        <h5>Litoral Tropical</h5>
                        <p>Águas cristalinas e areia branca em um dia ensolarado.</p>
                    </figcaption>
                </figure>
            </div>

            <!-- Controles de Avançar/Voltar -->
            <button class="carousel-control-prev" type="button" data-mdb-target="#carouselMaterialStyle" data-mdb-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-mdb-target="#carouselMaterialStyle" data-mdb-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Próximo</span>
            </button>

        </section>
    </main>

    <!-- JavaScript do MDBootstrap -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.umd.min.js"></script>
</body>

</html>
